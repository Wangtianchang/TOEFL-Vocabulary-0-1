<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>托福词汇自适应引擎</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Helvetica Neue', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app { width: 90%; max-width: 450px; text-align: center; }
        .word { font-size: 3rem; color: #fff; margin-bottom: 5px; }
        .def { color: #0070f3; font-size: 1.3rem; margin-bottom: 30px; }
        button { width: 100%; padding: 18px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 12px; cursor: pointer; font-size: 1rem; margin-bottom: 10px; transition: 0.2s; }
        button:hover { background: #333; }
    </style>
</head>
<body>
    <div id="app">
        <div class="word" id="w">Ready</div>
        <div class="def" id="d">点击下方开始学习</div>
        <button onclick="nextWord()">下一个单词</button>
        <button id="speakBtn" onclick="playVoice()" style="background:#0070f3; border:none;">听标准美音</button>
    </div>

    <script>
        // 词库数据
        const words = [
            {w: "Abandon", d: "v. 放弃，抛弃"},
            {w: "Ability", d: "n. 能力，才能"},
            {w: "Academic", d: "a. 学术的"}
        ];

        let i = 0;
        function nextWord() {
            i = (i + 1) % words.length;
            document.getElementById('w').innerText = words[i].w;
            document.getElementById('d').innerText = words[i].d;
        }

        function playVoice() {
            const word = document.getElementById('w').innerText;
            // 采用更稳妥的调用方式
            const msg = new SpeechSynthesisUtterance(word);
            msg.lang = 'en-US';
            msg.rate = 0.9;
            window.speechSynthesis.cancel(); // 强行清除队列
            window.speechSynthesis.speak(msg);
        }
        
        // 自动触发一次初始化
        nextWord();
    </script>
</body>
</html>
