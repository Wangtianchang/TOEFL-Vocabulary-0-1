<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>托福词汇内化系统</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #card { border: 1px solid #333; padding: 40px; border-radius: 15px; width: 80%; max-width: 400px; text-align: center; }
        .word { font-size: 2.5rem; color: #fff; margin-bottom: 10px; }
        .def { color: #0070f3; font-size: 1.2rem; margin-bottom: 20px; }
        button { padding: 15px 30px; background: #fff; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="card">
        <div class="word" id="w">Loading...</div>
        <div class="def" id="d">正在载入数据...</div>
        <button onclick="nextWord()">下一个单词</button>
        <button onclick="playVoice()" style="background:#333; color:#fff;">听发音</button>
    </div>
<script>
    let words = [];
    // 自动读取你上传的 words.json
    fetch('words.json')
        .then(res => res.json())
        .then(data => {
            words = data;
            nextWord();
        });

    let i = 0;
    function nextWord() {
        i = (i + 1) % words.length;
        document.getElementById('w').innerText = words[i].w;
        document.getElementById('d').innerText = words[i].d;
    }
    // ...其余函数不变
</script>
</body>
</html>
