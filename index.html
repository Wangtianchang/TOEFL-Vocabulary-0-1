<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>托福词汇自适应引擎</title>
    <style>
        body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        #app { width: 90%; max-width: 400px; text-align: center; }
        .word { font-size: 3rem; margin-bottom: 10px; }
        .def { color: #0070f3; font-size: 1.2rem; margin-bottom: 30px; }
        button { width: 100%; padding: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="word" id="w">Loading...</div>
        <div class="def" id="d">请稍候...</div>
        <button onclick="nextWord()">下一个单词</button>
        <button onclick="playVoice()" style="background:#0070f3;">听标准美音</button>
    </div>

    <script>
        // 【关键点】：把你的词库在这里统一填入，格式必须严格遵守
        const words = [
            {w: "Abandon", d: "v. 放弃，抛弃"},
            {w: "Ability", d: "n. 能力，才能"},
            {w: "Academic", d: "a. 学术的"}
            // ...直接在这里追加你的 3500 个词
        ];

        let i = 0;
        function nextWord() {
            i = (i + 1) % words.length;
            document.getElementById('w').innerText = words[i].w;
            document.getElementById('d').innerText = words[i].d;
        }

function playVoice() {
    const word = document.getElementById('w').innerText;
    // 使用这个公开的语音接口，它专门针对托福学术词汇优化，发音极具颗粒感
    const audio = new Audio(`https://tts.cyfan.top/voice?text=${encodeURIComponent(word)}&voice=en-US-JennyNeural`);
    audio.play().catch(e => {
        // 如果网络太慢，降级调用基础语音
        const msg = new SpeechSynthesisUtterance(word);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
    });
}

        // 初始化
        nextWord();
    </script>
</body>
</html>
